<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>

    <!-- index.css is after Bootstrap so your styles win -->
    <link rel="stylesheet" href="index.css">

    <title>Raw Materials Clearance</title>
</head>
<body>
    <!-- Intro video: plays first, then the Get Start page (section1) appears -->
    <div id="intro" class="intro" role="presentation">
        <video id="introVideo" class="intro-video"
               src="assets/lion-intro.mp4"
               poster="assets/lion-intro-poster.jpg"
               playsinline webkit-playsinline preload="auto"
               disablepictureinpicture disableremoteplayback
               controlslist="nodownload nofullscreen noremoteplayback"
               aria-hidden="true"></video>

        <!-- Shown only if the browser blocks autoplay -->
        <button type="button" id="tapPlay" class="intro-tap is-hidden" aria-label="Play intro">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>

        <button type="button" id="soundBtn" class="intro-sound is-hidden" aria-label="Turn sound on">
            <svg id="soundOff" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
            <svg id="soundOn" class="is-hidden" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>
        </button>

        <button type="button" id="skipBtn" class="intro-skip">Skip</button>
    </div>

    <noscript><style>#intro{display:none !important}#section1{display:block !important}</style></noscript>

    <div id="section1" class="is-hidden">
    <div class="enter-container">
        <div class="first-container">
            <h1 class="heading-start">Raw Material Clearance Status</h1>
        </div>
        <div class="second-img-container">
            <img src="qclion.jpg.jpeg" alt="" class="badge-icon-size" />
        </div>
        <div class="third-container">
            <p class="quotes">"Monitor Quality. Manage Progress. Maintain Excellence."</p>
        </div>
        <div class="start-button-container">
            <button class="Get-button" onclick="display('section2')">Get Start</button>
        </div>
    </div>
    </div>


    <div id="section2" class="is-hidden">
    <div class="main-container">
        <div class="Top-container">
            <h1 class="headin-1">Raw Material Acceptance Status</h1>
        </div>
        <div class="icon-container">
            <img src="qcspin.jpg.png" alt="" class="icon-size" />
        </div>
        <div class="middle-container">
            <form id="searchForm">
                <input type="text" id="idInput" name="idnumber" class="input-box" placeholder="Search ID Number" />
                <button type="submit" class="custom-buttom">search</button>
            </form>

            <!-- Search result is shown here -->
            <div id="result" class="result-box" aria-live="polite"></div>
        </div>
    </div>
    </div>

    <!-- Loading screen (shown between section1 and section2) -->
    <div id="loader" class="loader-overlay" aria-hidden="true">
        <div class="loader-box">
            <div class="spinner"></div>
            <p class="loader-text">Loading QC Dashboard...</p>
            <div class="load-bar"><div class="load-bar-fill" id="loaderBar"></div></div>
        </div>
    </div>

    <!-- SheetJS library (reads Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Your JS file -->
    <script src="index.js"></script>
     <script type="text/javascript" src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/js/ccbp-ui-kit.js"></script>
</body>
</html>
