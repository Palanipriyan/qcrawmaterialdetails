<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js" integrity="sha384-9/reFTGAW83EW2RDu2S0VKaIzap3H66lZH81PoYlFhbGU+6BZp6G7niu735Sk7lN" crossorigin="anonymous"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js" integrity="sha384-B4gt1jrGC7Jh4AgTPSdUtOBvfO8shuf57BaghqFfPlYxofvL8/KUEfYiJOMMV+rV" crossorigin="anonymous"></script>

    <!-- index.css is after Bootstrap so your styles win -->
    <link rel="stylesheet" href="index.css">

    <title>Raw Materials Clearance</title>
</head>
<body>
    <div id="section1">
    <div class="enter-container">
        <div class="first-container">
            <h1 class="heading-start">Raw Material Clearance Status</h1>
        </div>
        <div class="second-img-container">
            <img src="https://thumbs.dreamstime.com/b/quality-control-text-written-over-green-background-symbols-quality-control-green-random-shapes-circular-symbols-142376849.jpg" alt="" class="badge-icon-size" />
        </div>
        <div class="third-container">
            <p class="quotes">"Monitor Quality. Manage Progress. Maintain Excellence."</p>
        </div>
        <div class="start-button-container">
            <button class="Get-button" onclick="display('section2')">Get Start</button>
        </div>
    </div>
    </div>


    <div id="section2" class="is-hidden">
    <div class="main-container">
        <div class="Top-container">
            <h1 class="headin-1">Raw Material Acceptance Status</h1>
        </div>
        <div class="icon-container">
            <img src="https://png.pngtree.com/png-vector/20260115/ourmid/pngtree-qc-quality-control-vector-icon-illustration-png-image_18530362.webp" alt="" class="icon-size" />
        </div>
        <div class="middle-container">
            <form id="searchForm">
                <input type="text" id="idInput" name="idnumber" class="input-box" placeholder="Search ID Number" />
                <button type="submit" class="custom-buttom">search</button>
            </form>

            <!-- Search result is shown here -->
            <div id="result" class="result-box" aria-live="polite"></div>
        </div>
    </div>
    </div>

    <!-- Loading screen (shown between section1 and section2) -->
    <div id="loader" class="loader-overlay" aria-hidden="true">
        <div class="loader-box">
            <div class="spinner"></div>
            <p class="loader-text">Loading QC Dashboard...</p>
            <div class="load-bar"><div class="load-bar-fill" id="loaderBar"></div></div>
        </div>
    </div>

    <!-- SheetJS library (reads Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Your JS file -->
    <script src="index.js"></script>
     <script type="text/javascript" src="https://d2clawv67efefq.cloudfront.net/ccbp-static-website/js/ccbp-ui-kit.js"></script>
</body>
</html>
